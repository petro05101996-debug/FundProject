events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server {
        listen 8080;
        server_name _;
        client_max_body_size 20m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        location /health { proxy_pass http://127.0.0.1:8000/health; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/ { proxy_pass http://127.0.0.1:8000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 120s; }
        location /assets/ { root /app/frontend_dist; try_files $uri =404; access_log off; expires 30d; }
        location / { root /app/frontend_dist; try_files $uri $uri/ /index.html; }
    }
}
